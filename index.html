<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HolyTiers | Myanmar PvP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>

<div id="welcome-screen" class="welcome-overlay">
    <div class="welcome-content">
        <h1 class="logo-large">MINE<span>TIERS</span></h1>
        <p>The Official Mine Tier List</p>
        <button class="enter-btn" onclick="enterSite()">EXPLORE RANKINGS <i class="fa-solid fa-bolt"></i></button>
        <h6>Developer - MikeTheClover</h6>
        <a id="modalDiscordLink" href="https://discord.gg/S8wdVJBp8N" target="_blank" class="discord-btn">
        <i class="fa-brands fa-discord"></i> JOIN DISCORD
        </a>
        
</div>
    </div>
</div>



<div id="main-content" class="elite-app" style="display: none;">
    <aside class="side-nav">
        <div class="logo">MINE<span>TIERS</span></div>
        <nav class="nav-container">
            <div class="nav-section">
                <small>GENERAL</small>
                <button class="nav-item active" onclick="switchMode('Overall')">🏆 Overall</button>
            </div>
            <div class="nav-section">
                <small>CORE MODES</small>
                <button class="nav-item" onclick="switchMode('Sword')">⚔️ Sword</button>
                <button class="nav-item" onclick="switchMode('Axe')">🪓 Axe</button>
                <button class="nav-item" onclick="switchMode('Mace')">🔱 Mace</button>
                <button class="nav-item" onclick="switchMode('Diamond SMP')">🌍 Diamond SMP</button>
            </div>
            <div class="nav-section">
                <small>POTION & CRYSTAL</small>
                <button class="nav-item" onclick="switchMode('Neth Pot')">🧪 Neth Pot</button>
                <button class="nav-item" onclick="switchMode('Crystal')">🔮 Crystal</button>
            </div>
        </nav>
    </aside>

    <main class="main-stage">
        <header class="stage-header">
            <h1 id="mode-title">Overall Rankings</h1>
            <div class="header-right">
                <div class="search-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="searchInput" placeholder="Search Myanmar players..." onkeyup="filterPlayers()">
                </div>
            </div>
        </header>

        <div class="leaderboard-grid" id="playerList">
            </div>
    </main>
</div>

<div id="playerModal" class="modal-overlay">
    <div class="modal-content">
        <button class="modal-back-btn" onclick="closeModal()">
            <i class="fa-solid fa-arrow-left"></i> Back to List
        </button>
        
        <div class="modal-p-avatar">
            <img id="modalAvatar" src="" alt="">
        </div>
        
        <div class="modal-p-details">
            <h1 id="modalName">Name</h1>
            <div class="region-badge">ASIA / MM</div>
            <a id="modalDiscord" href="#" target="_blank" class="discord-link-btn">
                <i class="fa-brands fa-discord"></i> Connect Discord
            </a>
        </div>
        
        <div class="modal-p-ranks">
            <div class="r-row gold-rank">
                <span id="modalPosition" class="r-num">1.</span>
                <span id="modalCurrentMode" class="r-mode">RANK</span>
                <span id="modalTier" class="r-pts">HT1</span>
            </div>
        
        </div>
    </div>
</div>

<button class="mobile-menu-btn" onclick="toggleMenu()">
    <i class="fa-solid fa-bars"></i>
</button>

<aside class="side-nav" id="sidebar">
    </aside>

    <div class="modal-p-details">
    <h1 id="modalName">Name</h1>
    <div class="region-badge">ASIA / MM</div>
    
    

<script src="script.js"></script>
</body>
</html>
